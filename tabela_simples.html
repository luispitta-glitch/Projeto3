<html>
<head>
	<meta charset="UTF-8">
	<title>Tabela de Preços</title>
</head>
<body>

	<table style="width: 100%; border-collapse: collapse; font-family: sans-serif;">
	  <!-- Linha do Cabeçalho -->
	  <tr style="background-color: #2c3e50; color: #ffffff;">
		 <td style="border: 1px solid #000000; padding: 12px; font-weight: bold;">Produto</td>
		 <td style="border: 1px solid #000000; padding: 12px; font-weight: bold;">Quantidade</td>
		 <td style="border: 1px solid #000000; padding: 12px; font-weight: bold;">Preço</td>
	  </tr>

	  <!-- Linha 1 -->
	  <tr style="background-color: #f8f9fa;">
		 <td style="border: 1px solid #000000; padding: 10px;">Notebook</td>
		 <td style="border: 1px solid #000000; padding: 10px;">1</td>
		 <td style="border: 1px solid #000000; padding: 10px;">3.500 Euros</td>
	  </tr>

	  <!-- Linha 2 (Cor de fundo alternada) -->
	  <tr style="background-color: #e9ecef;">
		 <td style="border: 1px solid #000000; padding: 10px;">Rato Sem Fios</td>
		 <td style="border: 1px solid #000000; padding: 10px;">2</td>
		 <td style="border: 1px solid #000000; padding: 10px;">160 Euros</td>
	  </tr>

	  <!-- Linha 3 -->
	  <tr style="background-color: #f8f9fa;">
		 <td style="border: 1px solid #000000; padding: 10px;">Teclado Mecanico</td>
		 <td style="border: 1px solid #000000; padding: 10px;">1</td>
		 <td style="border: 1px solid #000000; padding: 10px;">250 Euros</td>
	  </tr>
	</table>
	
</body>
</html>
