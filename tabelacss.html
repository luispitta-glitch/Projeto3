<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <style>
    table {
      width: 100%;
      border-collapse: collapse; /* Unifica as bordas duplas */
    }

    th, td {
      border: 1px solid #ccc; /* Espessura, estilo e cor da borda */
      padding: 8px 12px;     /* Espaçamento interno das células */
      text-align: left;
    }

    th {
      background-color: #f4f4f4; /* Destaque para o cabeçalho */
    }
  </style>
</head>

<body>

  <table>
    <thead>
      <tr>
        <th>Produto</th>
        <th>Preço</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Notebook</td>
        <td>3500 Euros</td>
      </tr>
      <tr>
        <td>Rato</td>
        <td>80 Euros</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
